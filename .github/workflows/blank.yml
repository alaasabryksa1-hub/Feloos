
name: Feloos Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "Feloos-diverse-1000-questions.zip" ]; then
            echo "ERROR: Project ZIP was not found in repository root."
            exit 1
          fi

          mkdir -p extracted
          unzip -q Feloos-diverse-1000-questions.zip -d extracted

          if [ ! -f "extracted/Feloos/android/app/build.gradle.kts" ]; then
            echo "ERROR: Android project was not found at the expected path."
            find extracted -maxdepth 5 -name build.gradle.kts -print
            exit 1
          fi

          echo "Project ZIP extracted successfully."

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK not found at $SDK"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Replace AdMob IDs and fix startup
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path("extracted/Feloos")

          gradle_file = root / "android/app/build.gradle.kts"
          controller = root / (
              "android/app/src/main/java/com/feloos/quiz/"
              "RewardedInterstitialController.kt"
          )
          game = root / "android/app/src/main/assets/www/game.js"

          for path in (gradle_file, controller, game):
              if not path.is_file():
                  sys.exit(f"ERROR: Required file not found: {path}")

          replacements = {
              "ca-app-pub-3940256099942544~3347511713":
                  "ca-app-pub-6809664188772391~4277962751",
              "ca-app-pub-3940256099942544/5354046379":
                  "ca-app-pub-6809664188772391/9067340729",
              "ca-app-pub-3940256099942544/9257395921":
                  "ca-app-pub-6809664188772391/8952412776",
              "ca-app-pub-3940256099942544/2247696110":
                  "ca-app-pub-6809664188772391/2226600206",
          }

          text_files = [
              gradle_file,
              controller,
              game,
          ]

          changed = 0

          for path in text_files:
              original = path.read_text(encoding="utf-8")
              updated = original

              for old, new in replacements.items():
                  updated = updated.replace(old, new)

              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed += 1

          print(f"AdMob ID replacement completed. Files changed: {changed}")

          source = game.read_text(encoding="utf-8")

          pattern = re.compile(
              r'if\s*\(\s*state\.open\s*\)\s*'
              r'resumeIfNeeded\s*\(\s*\)\s*;\s*'
              r'else\s*screen\s*=\s*["\']home["\']\s*;'
          )

          updated, count = pattern.subn(
              'if (state.open) { state.open = null; save(); } '
              'screen = "home";',
              source,
              count=1
          )

          if count != 1:
              sys.exit(
                  "ERROR: Expected startup code was not found in game.js. "
                  "Build stopped instead of claiming the fix was applied."
              )

          game.write_text(updated, encoding="utf-8")
          print("Startup fix applied successfully.")

          remaining = []
          for path in (gradle_file, controller):
              content = path.read_text(encoding="utf-8")
              if "ca-app-pub-3940256099942544" in content:
                  remaining.append(str(path))

          if remaining:
              sys.exit(
                  "ERROR: Test AdMob IDs remain in: "
                  + ", ".join(remaining)
              )

          print("AdMob configuration checks passed.")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p extracted/Feloos/android assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Feloos-debug-APK
          path: extracted/Feloos/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
