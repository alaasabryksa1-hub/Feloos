name: Feloos Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find source ZIP
        shell: bash
        run: |
          set -e
          if [ -f "Feloos-ad-review-fixes.zip" ]; then
            echo "ZIP_FILE=Feloos-ad-review-fixes.zip" >> "$GITHUB_ENV"
          elif [ -f "Feloos-ads-implementation.zip" ]; then
            echo "ZIP_FILE=Feloos-ads-implementation.zip" >> "$GITHUB_ENV"
          else
            echo "ERROR: Feloos source ZIP is missing."
            exit 1
          fi

      - name: Extract source
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/feloos-source
          unzip -q "$ZIP_FILE" -d /tmp/feloos-source

          if [ -d /tmp/feloos-source/Feloos/android ]; then
            cp -a /tmp/feloos-source/Feloos/. .
          elif [ -d /tmp/feloos-source/android ]; then
            cp -a /tmp/feloos-source/. .
          else
            echo "ERROR: Android project not found inside ZIP."
            find /tmp/feloos-source -maxdepth 4 -type f | head -100
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Check Google Ads dependency and imports
        shell: bash
        run: |
          set -e
          FILE="android/app/src/main/java/com/feloos/quiz/MainActivity.kt"
          test -f "$FILE"

          if ! grep -q 'play-services-ads' android/app/build.gradle.kts; then
            echo "ERROR: Google Mobile Ads dependency missing."
            exit 1
          fi

          echo "Google Ads dependency:"
          grep 'play-services-ads' android/app/build.gradle.kts

          echo "Interstitial imports:"
          grep -n 'InterstitialAd' "$FILE" || true

      - name: Validate game files
        shell: bash
        run: |
          if [ -f scripts/check-game.mjs ]; then
            node scripts/check-game.mjs
          else
            echo "Game validation script not present; skipping."
          fi

      - name: Build APK and AAB
        shell: bash
        run: |
          set -e
          gradle -p android clean assembleDebug bundleRelease

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Feloos-Android-Build
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
