
name: Build Feloos Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect project files
        shell: bash
        run: |
          set -eu
          echo "Repository files:"
          find . -maxdepth 4 -type f \
            -not -path "./.git/*" | sort | head -200
          echo "ZIP files:"
          find . -maxdepth 6 -type f \
            -iname "*.zip" \
            -not -path "./.git/*" -print
