name: Feloos Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Feloos-diverse-1000-questions.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Project ZIP not found: $ZIP"
            ls -la
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          if [ ! -f "extracted/Feloos/android/app/build.gradle.kts" ]; then
            echo "ERROR: Android project not found at expected path."
            find extracted -maxdepth 7 -name build.gradle.kts -print
            exit 1
          fi

          echo "Project ZIP extracted successfully."

      - name: Update AdMob IDs
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import sys

          root = Path("extracted/Feloos")

          replacements = {
              # Android App ID: test and previous IDs
              "ca-app-pub-3940256099942544~3347511713":
                  "ca-app-pub-6809664188772391~2995395585",
              "ca-app-pub-6809664188772391~4277962751":
                  "ca-app-pub-6809664188772391~2995395585",

              # Rewarded ad
              "ca-app-pub-3940256099942544/5354046379":
                  "ca-app-pub-6809664188772391/3404946359",

              # Rewarded interstitial
              "ca-app-pub-3940256099942544/9257395921":
                  "ca-app-pub-6809664188772391/7795014869",
              "ca-app-pub-6809664188772391/9067340729":
                  "ca-app-pub-6809664188772391/7795014869",

              # Banner
              "ca-app-pub-3940256099942544/6300978111":
                  "ca-app-pub-6809664188772391/4137864516",

              # App open
              "ca-app-pub-3940256099942544/3419835294":
                  "ca-app-pub-6809664188772391/5941900776",
              "ca-app-pub-6809664188772391/8952412776":
                  "ca-app-pub-6809664188772391/5941900776",

              # Standard interstitial
              "ca-app-pub-3940256099942544/1033173712":
                  "ca-app-pub-6809664188772391/4737289453",

              # Native advanced
              "ca-app-pub-3940256099942544/2247696110":
                  "ca-app-pub-6809664188772391/9494792118",
              "ca-app-pub-6809664188772391/2226600206":
                  "ca-app-pub-6809664188772391/9494792118",
          }

          extensions = {
              ".kt", ".kts", ".java", ".xml", ".js",
              ".html", ".json", ".gradle", ".properties"
          }

          changed = []
          scanned = 0

          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in extensions:
                  continue

              if any(
                  part in {"build", ".gradle", "node_modules"}
                  for part in path.parts
              ):
                  continue

              try:
                  original = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              scanned += 1
              updated = original

              for old, new in replacements.items():
                  updated = updated.replace(old, new)

              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))

          print(f"Source files scanned: {scanned}")
          print(f"Source files updated: {len(changed)}")

          for path in changed:
              print(f"Updated: {path}")

          if not scanned:
              sys.exit("ERROR: No source files were scanned.")

          all_text = []

          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in extensions:
                  continue

              if any(
                  part in {"build", ".gradle", "node_modules"}
                  for part in path.parts
              ):
                  continue

              try:
                  all_text.append(path.read_text(encoding="utf-8"))
              except (UnicodeDecodeError, OSError):
                  pass

          combined = "\n".join(all_text)

          app_id = "ca-app-pub-6809664188772391~2995395585"

          if app_id not in combined:
              sys.exit(
                  "ERROR: New AdMob App ID was not found in source files."
              )

          if "ca-app-pub-3940256099942544" in combined:
              print(
                  "WARNING: Some Google test IDs remain; "
                  "review the source before publishing."
              )

          print("AdMob App ID verification passed.")
          PY

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK not found: $SDK"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p extracted/Feloos/android assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Feloos-debug-APK
          path: extracted/Feloos/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
