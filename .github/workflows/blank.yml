name: Feloos Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check source ZIP
        shell: bash
        run: |
          set -e
          if [ -f "Feloos-ad-review-fixes.zip" ]; then
            ZIP_FILE="Feloos-ad-review-fixes.zip"
          elif [ -f "Feloos-ads-implementation.zip" ]; then
            ZIP_FILE="Feloos-ads-implementation.zip"
          else
            echo "ERROR: Source ZIP not found in repository root."
            echo "Upload Feloos-ad-review-fixes.zip or Feloos-ads-implementation.zip"
            exit 1
          fi
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Feloos project
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/feloos-source
          unzip -q "$ZIP_FILE" -d /tmp/feloos-source

          if [ -d "/tmp/feloos-source/Feloos" ]; then
            cp -a /tmp/feloos-source/Feloos/. .
          elif [ -f "/tmp/feloos-source/android/settings.gradle" ] || \
               [ -f "/tmp/feloos-source/android/settings.gradle.kts" ]; then
            cp -a /tmp/feloos-source/. .
          else
            echo "ERROR: Could not find the Feloos Android project inside ZIP."
            find /tmp/feloos-source -maxdepth 3 -type f | head -80
            exit 1
          fi

      - name: Verify Android project
        shell: bash
        run: |
          set -e
          test -d android
          test -f android/app/build.gradle.kts -o \
               -f android/app/build.gradle
          test -f android/gradlew || \
               echo "Gradle wrapper not found; using installed Gradle."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Validate game files if checker exists
        shell: bash
        run: |
          if [ -f scripts/check-game.mjs ]; then
            node scripts/check-game.mjs
          else
            echo "No game checker script found; continuing."
          fi

      - name: Build APK and AAB
        shell: bash
        run: |
          set -e
          gradle -p android assembleDebug bundleRelease

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Feloos-Android-Build
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
