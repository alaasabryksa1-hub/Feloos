
name: Feloos Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "Feloos-diverse-1000-questions.zip" ]; then
            echo "ERROR: Project ZIP was not found in repository root."
            exit 1
          fi

          mkdir -p extracted
          unzip -q Feloos-diverse-1000-questions.zip -d extracted

          if [ ! -f "extracted/Feloos/android/app/build.gradle.kts" ]; then
            echo "ERROR: Android project was not found at the expected path."
            find extracted -maxdepth 5 -name build.gradle.kts -print
            exit 1
          fi

          echo "Project ZIP extracted successfully."

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK not found at $SDK"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Update AdMob IDs and fix startup
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path("extracted/Feloos")

          gradle_file = root / "android/app/build.gradle.kts"
          controller = root / (
              "android/app/src/main/java/com/feloos/quiz/"
              "RewardedInterstitialController.kt"
          )
          game = root / "android/app/src/main/assets/www/game.js"

          for path in (gradle_file, controller, game):
              if not path.is_file():
                  sys.exit(f"ERROR: Required file not found: {path}")

          replacements = {
              # Feloos Android App ID
              "ca-app-pub-3940256099942544~3347511713":
                  "ca-app-pub-6809664188772391~2995395585",

              # Rewarded Quiz: 5 coins after confirmed reward
              "ca-app-pub-3940256099942544/5354046379":
                  "ca-app-pub-6809664188772391/3404946359",

              # Rewarded interstitial
              "ca-app-pub-3940256099942544/9257395921":
                  "ca-app-pub-6809664188772391/7795014869",

              # Banner
              "ca-app-pub-3940256099942544/6300978111":
                  "ca-app-pub-6809664188772391/4137864516",

              # App open
              "ca-app-pub-3940256099942544/3419835294":
                  "ca-app-pub-6809664188772391/5941900776",

              # Standard interstitial
              "ca-app-pub-3940256099942544/1033173712":
                  "ca-app-pub-6809664188772391/4737289453",

              # Native advanced
              "ca-app-pub-3940256099942544/2247696110":
                  "ca-app-pub-6809664188772391/9494792118",
          }

          extensions = {
              ".kt", ".kts", ".java", ".xml", ".js",
              ".html", ".json", ".gradle", ".properties"
          }

          changed_files = []

          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in extensions:
                  continue

              if any(
                  part in {"build", ".gradle", "node_modules"}
                  for part in path.parts
              ):
                  continue

              try:
                  original = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              updated = original
              for old, new in replacements.items():
                  updated = updated.replace(old, new)

              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed_files.append(str(path))

          print("AdMob ID replacement finished.")
          print(f"Files changed: {len(changed_files)}")

          # Restore the known startup fix from the previous workflow.
          source = game.read_text(encoding="utf-8")

          pattern = re.compile(
              r'if\s*\(\s*state\.open\s*\)\s*'
              r'resumeIfNeeded\s*\(\s*\)\s*;\s*'
              r'else\s*screen\s*=\s*["\']home["\']\s*;'
          )

          updated, count = pattern.subn(
              'if (state.open) { state.open = null; save(); } '
              'screen = "home";',
              source,
              count=1
          )

          if count == 1:
              game.write_text(updated, encoding="utf-8")
              print("Startup fix applied.")
          else:
              print(
                  "Startup pattern not found; existing startup code "
                  "was left unchanged."
              )

          # Check for remaining Google test IDs in relevant source files.
          remaining = []

          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in extensions:
                  continue

              if any(
                  part in {"build", ".gradle", "node_modules"}
                  for part in path.parts
              ):
                  continue

              try:
                  content = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              if "ca-app-pub-3940256099942544" in content:
                  remaining.append(str(path))

          if remaining:
              print("WARNING: Google test IDs remain in:")
              for path in remaining:
                  print(path)
          else:
              print("No Google test publisher IDs found in source files.")

          # Confirm that the intended new IDs exist in the project.
          all_text = []

          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in extensions:
                  continue

              try:
                  all_text.append(path.read_text(encoding="utf-8"))
              except (UnicodeDecodeError, OSError):
                  continue

          combined = "\n".join(all_text)

          expected_app_id = (
              "ca-app-pub-6809664188772391~2995395585"
          )

          if expected_app_id not in combined:
              sys.exit(
                  "ERROR: New Feloos App ID was not found in source files. "
                  "Check the Android manifest/build configuration."
              )

          print("App ID verification passed.")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p extracted/Feloos/android assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Feloos-debug-APK
          path: extracted/Feloos/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
