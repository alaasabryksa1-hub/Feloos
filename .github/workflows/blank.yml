
name: Feloos Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 3 -type f -name 'Feloos-diverse-1000-questions.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP was not found."
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          echo "Project extracted successfully."

      - name: Replace AdMob test IDs and fix startup
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          base = Path("extracted")

          replacements = {
              "ca-app-pub-3940256099942544~3347511713":
                  "ca-app-pub-6809664188772391~4277962751",
              "ca-app-pub-3940256099942544/5354046379":
                  "ca-app-pub-6809664188772391/9067340729",
              "ca-app-pub-3940256099942544/9257395921":
                  "ca-app-pub-6809664188772391/8952412776",
              "ca-app-pub-3940256099942544/2247696110":
                  "ca-app-pub-6809664188772391/2226600206",
          }

          changed_files = 0
          for path in base.rglob("*"):
              if not path.is_file() or path.suffix.lower() in {
                  ".zip", ".png", ".jpg", ".jpeg", ".webp",
                  ".gif", ".so", ".jar", ".class", ".apk"
              }:
                  continue

              try:
                  original = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              updated = original
              for old, new in replacements.items():
                  updated = updated.replace(old, new)

              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed_files += 1

          print(f"AdMob ID replacement completed. Files changed: {changed_files}")

          game_files = list(base.rglob("game.js"))
          if not game_files:
              sys.exit("ERROR: game.js was not found in the extracted project.")

          startup_pattern = re.compile(
              r'if\s*\(\s*state\.open\s*\)\s*'
              r'resumeIfNeeded\s*\(\s*\)\s*;\s*'
              r'else\s*screen\s*=\s*["\']home["\']\s*;',
              re.MULTILINE
          )

          patched = False
          for game_file in game_files:
              source = game_file.read_text(encoding="utf-8")
              updated, count = startup_pattern.subn(
                  'if (state.open) { state.open = null; save(); } '
                  'screen = "home";',
                  source,
                  count=1
              )
              if count:
                  game_file.write_text(updated, encoding="utf-8")
                  print(f"Startup fix applied to: {game_file}")
                  patched = True
                  break

          if not patched:
              sys.exit(
                  "ERROR: Expected startup code was not found. "
                  "Build stopped to avoid producing an unverified APK."
              )
          PY

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail
          GRADLEW="$(find extracted -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: Gradle wrapper (gradlew) was not found."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW"
          echo "Gradle project: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Feloos-debug-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
