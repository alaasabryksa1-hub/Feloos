
name: Build Feloos Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -eu
          unzip -q Feloos-diverse-1000-questions.zip -d extracted
          test -f extracted/Feloos/android/app/build.gradle.kts

      - name: Fix AdMob IDs and restore home startup
        shell: bash
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("extracted/Feloos")
          gradle_file = root / "android/app/build.gradle.kts"
          controller = root / "android/app/src/main/java/com/feloos/quiz/RewardedInterstitialController.kt"
          game = root / "android/app/src/main/assets/www/game.js"

          for p in (gradle_file, controller, game):
              if not p.is_file():
                  raise SystemExit(f"Missing required file: {p}")

          replacements = {
              "ca-app-pub-3940256099942544~3347511713":
                  "ca-app-pub-6809664188772391~4277962751",
              "ca-app-pub-3940256099942544/5354046379":
                  "ca-app-pub-6809664188772391/9067340729",
              "ca-app-pub-3940256099942544/9257395921":
                  "ca-app-pub-6809664188772391/8952412776",
              "ca-app-pub-3940256099942544/2247696110":
                  "ca-app-pub-6809664188772391/2226600206",
          }

          text = gradle_file.read_text()
          for old, new in replacements.items():
              text = text.replace(old, new)
          gradle_file.write_text(text)

          text = controller.read_text()
          text = text.replace(
              "ca-app-pub-3940256099942544/5354046379",
              "ca-app-pub-6809664188772391/9067340729"
          )
          controller.write_text(text)

          # Restore the previously used home-screen startup fix.
          pattern = re.compile(
              r'if\s*\(\s*state\.open\s*\)\s*'
              r'resumeIfNeeded\s*\(\s*\)\s*;\s*'
              r'else\s*screen\s*=\s*["\']home["\']\s*;'
          )

          patched = False
          for p in root.rglob("game.js"):
              source = p.read_text(errors="replace")
              updated, count = pattern.subn(
                  'if (state.open) { state.open = null; save(); } '
                  'screen = "home";',
                  source,
                  count=1
              )
              if count:
                  p.write_text(updated)
                  print("Startup fixed:", p)
                  if p == game:
                      patched = True

          if not patched:
              raise SystemExit(
                  "Startup pattern was not found in Android game.js; "
                  "stopping to avoid building an unverified startup."
              )

          if "ca-app-pub-3940256099942544" in gradle_file.read_text():
              raise SystemExit("Test IDs remain in build.gradle.kts")

          print("AdMob configuration and startup checks passed.")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle -p extracted/Feloos/android assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Feloos-debug-apk
          path: extracted/Feloos/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
