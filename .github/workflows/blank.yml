
name: Build Feloos Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -eu
          ZIP_FILE="Feloos-diverse-1000-questions.zip"
          test -f "$ZIP_FILE" || {
            echo "ERROR: Project ZIP not found"
            exit 1
          }
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR="extracted/Feloos/android"
          test -f "$PROJECT_DIR/settings.gradle" -o \
               -f "$PROJECT_DIR/settings.gradle.kts" || {
            echo "ERROR: Android project not found"
            exit 1
          }

      - name: Inspect AdMob configuration
        shell: bash
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("extracted/Feloos")
          patterns = [
              r"ca-app-pub-\d{16,20}[~/]\d{8,12}",
              r"3940256099942544",
              r"testDevices",
              r"setTestDeviceIds",
              r"addTestDevice",
              r"MobileAds\.initialize",
              r"RequestConfiguration",
              r"test.?ad",
              r"AdRequest",
          ]
          regex = re.compile("|".join(patterns), re.I)
          found = 0

          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              if path.suffix.lower() not in {
                  ".js", ".html", ".xml", ".json", ".gradle",
                  ".kts", ".java", ".kt", ".properties", ".txt"
              }:
                  continue
              try:
                  lines = path.read_text(errors="replace").splitlines()
              except OSError:
                  continue
              for number, line in enumerate(lines, 1):
                  if regex.search(line):
                      print(f"{path}:{number}: {line[:500]}")
                      found += 1

          print(f"AdMob inspection complete. Matching lines: {found}")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle -p extracted/Feloos/android assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Feloos-debug-apk
          path: extracted/Feloos/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
