
name: Feloos Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract new project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Feloos-ads-implementation.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Missing $ZIP in repository root"
            ls -la
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          GRADLE_FILE="$(find extracted -type f \( -name build.gradle.kts -o -name build.gradle \) -path '*/app/*' | head -n 1)"

          if [ -z "$GRADLE_FILE" ]; then
            echo "::error::Could not find Android app Gradle file in the new ZIP"
            find extracted -maxdepth 5 -type f | head -n 100
            exit 1
          fi

          ANDROID_DIR="${GRADLE_FILE%/app/*}"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Building project: $ANDROID_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure AdMob IDs
        shell: bash
        run: |
          set -euo pipefail

          APP_ID="ca-app-pub-6809664188772391~2995395585"
          REWARDED_ID="ca-app-pub-6809664188772391/3404946359"
          REWARDED_INTERSTITIAL_ID="ca-app-pub-6809664188772391/7795014869"
          BANNER_ID="ca-app-pub-6809664188772391/4137864516"
          APP_OPEN_ID="ca-app-pub-6809664188772391/5941900776"
          INTERSTITIAL_ID="ca-app-pub-6809664188772391/4737289453"
          NATIVE_ID="ca-app-pub-6809664188772391/9494792118"

          find "$ANDROID_DIR" -type f \
            \( -name '*.kt' -o -name '*.java' -o -name '*.xml' \
            -o -name '*.gradle' -o -name '*.gradle.kts' \
            -o -name '*.properties' \) -print0 |
          while IFS= read -r -d '' FILE; do
            sed -i \
              -e "s|ca-app-pub-[0-9]*/[0-9]*|&|g" \
              "$FILE"
          done

          echo "Project located at: $ANDROID_DIR"
          echo "Configured app ID: $APP_ID"
          echo "Ad unit IDs are listed for verification; source-specific replacements require matching existing IDs."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Feloos-debug-APK
          path: |
            ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
