
name: Build Feloos Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check original ZIP
        run: |
          test -f Feloos-diverse-1000-questions.zip
          unzip -q Feloos-diverse-1000-questions.zip -d .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build release APK
        run: gradle -p Feloos/android assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Feloos-release-apk
          path: Feloos/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
