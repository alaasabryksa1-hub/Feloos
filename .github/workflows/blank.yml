
name: Feloos Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract new Feloos project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Feloos-ads-implementation.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Missing project ZIP: $ZIP"
            exit 1
          fi

          mkdir -p extracted
          unzip -q -o "$ZIP" -d extracted

          GRADLE_FILE="$(find extracted -type f \( -name build.gradle.kts -o -name build.gradle \) -path '*/app/*' | head -n 1)"

          if [ -z "$GRADLE_FILE" ]; then
            echo "::error::Could not find app Gradle file"
            find extracted -maxdepth 5 -type f | head -n 100
            exit 1
          fi

          ANDROID_DIR="${GRADLE_FILE%/app/*}"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $ANDROID_DIR"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_DIR"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            curl -fL --retry 3 \
              https://services.gradle.org/distributions/gradle-8.13-bin.zip \
              -o "$RUNNER_TEMP/gradle.zip"

            mkdir -p "$RUNNER_TEMP/gradle"
            unzip -q -o "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"

            GRADLE_BIN="$RUNNER_TEMP/gradle/gradle-8.13/bin/gradle"

            if [ ! -x "$GRADLE_BIN" ]; then
              echo "::error::Gradle executable not found after extraction"
              find "$RUNNER_TEMP/gradle" -maxdepth 4 -type f | head -n 50
              exit 1
            fi

            "$GRADLE_BIN" --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Feloos-debug-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
