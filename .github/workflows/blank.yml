
name: Build Feloos Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract project ZIP
        shell: bash
        run: |
          set -eu
          ZIP_FILE="Feloos-diverse-1000-questions.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d extracted

          echo "Android project files:"
          find extracted \( -name build.gradle -o -name build.gradle.kts -o -name AndroidManifest.xml \) -print

      - name: Inspect game startup logic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("extracted")
          terms = re.compile(
              r"resumeIfNeeded|onboarded|signedOut|"
              r"screen\s*=|localStorage|sessionStorage|"
              r"DOMContentLoaded|function\s+init|function\s+start",
              re.I
          )

          files = list(root.rglob("game.js"))
          if not files:
              print("ERROR: game.js was not found in extracted ZIP")
              raise SystemExit(1)

          for file in files:
              lines = file.read_text(errors="replace").splitlines()
              hits = [
                  i for i, line in enumerate(lines)
                  if terms.search(line)
              ]

              print(f"\n===== {file} =====")
              shown = set()

              for i in hits:
                  for j in range(max(0, i - 3), min(len(lines), i + 5)):
                      if j not in shown:
                          print(f"{j + 1}: {lines[j]}")
                          shown.add(j)
                  print("---")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        shell: bash
        run: |
          set -eu
          PROJECT_DIR="extracted/Feloos/android"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: Android Gradle project not found at $PROJECT_DIR"
            echo "Actual extracted structure:"
            find extracted -maxdepth 5 -type f | sort | head -300
            exit 1
          fi

          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Feloos-debug-apk
          path: extracted/Feloos/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
