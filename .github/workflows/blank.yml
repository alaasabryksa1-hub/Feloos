
name: Build Feloos Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q Feloos-diverse-1000-questions.zip -d extracted
          echo "Files inside ZIP:"
          find extracted -maxdepth 6 -type f | head -200

      - name: Find Android project
        id: project
        shell: bash
        run: |
          ROOT=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit | xargs -r dirname)

          if [ -z "$ROOT" ]; then
            echo "ERROR: Android Gradle project not found in ZIP."
            exit 1
          fi

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Project root: $ROOT"

      - name: Fix App Open Ad callback
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          FILE="app/src/main/java/com/feloos/quiz/MainActivity.kt"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: MainActivity.kt not found at $FILE"
            find app/src -name MainActivity.kt -print
            exit 1
          fi

          sed -i \
            '/^import com\.google\.android\.gms\.ads\.appopen\.AppOpenAdLoadCallback$/d' \
            "$FILE"

          sed -i \
            's/object : AppOpenAdLoadCallback()/object : AppOpenAd.AppOpenAdLoadCallback()/g' \
            "$FILE"

          echo "Checking callback references:"
          grep -n 'AppOpenAdLoadCallback\|import.*AppOpenAd' "$FILE" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK and AAB
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          gradle assembleDebug
          gradle bundleRelease

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Feloos-Android-Build
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/bundle/**/*.aab
          if-no-files-found: error
