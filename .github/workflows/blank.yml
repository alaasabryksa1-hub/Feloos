
name: Build Feloos Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -eu
          ZIP_FILE="Feloos-diverse-1000-questions.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR="extracted/Feloos/android"
          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: Android project not found."
            find extracted -maxdepth 5 -type f | sort | head -300
            exit 1
          fi

      - name: Fix startup to home screen
        shell: bash
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("extracted/Feloos")
          android_game = root / "android/app/src/main/assets/www/game.js"

          if not android_game.is_file():
              print("ERROR: Android game.js not found:", android_game)
              for p in root.rglob("game.js"):
                  print("Found:", p)
              raise SystemExit(1)

          pattern = re.compile(
              r'if\s*\(\s*state\.open\s*\)\s*'
              r'resumeIfNeeded\s*\(\s*\)\s*;\s*'
              r'else\s*screen\s*=\s*["\']home["\']\s*;'
          )

          replacement = (
              'if (state.open) { state.open = null; save(); } '
              'screen = "home";'
          )

          patched_android = False

          for file in root.rglob("game.js"):
              content = file.read_text(errors="replace")
              updated, count = pattern.subn(replacement, content, count=1)

              if count:
                  file.write_text(updated)
                  print("PATCHED:", file)
                  if file == android_game:
                      patched_android = True

          if not patched_android:
              print("ERROR: Startup code did not match; no APK was built.")
              lines = android_game.read_text(errors="replace").splitlines()
              for i, line in enumerate(lines):
                  if "resumeIfNeeded" in line or "state.open" in line:
                      start = max(0, i - 5)
                      end = min(len(lines), i + 7)
                      for j in range(start, end):
                          print(f"{j + 1}: {lines[j]}")
                      print("---")
              raise SystemExit(1)

          print("Startup patch verified.")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        shell: bash
        run: |
          set -eu
          gradle -p extracted/Feloos/android assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Feloos-debug-apk
          path: extracted/Feloos/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
