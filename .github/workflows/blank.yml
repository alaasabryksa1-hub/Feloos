
name: Feloos Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Feloos-ads-implementation.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Project ZIP not found: $ZIP"
            exit 1
          fi

          mkdir -p extracted
          unzip -q -o "$ZIP" -d extracted

          GRADLE_FILE="$(find extracted -type f \( -name build.gradle.kts -o -name build.gradle \) -path '*/app/*' | head -n 1)"

          if [ -z "$GRADLE_FILE" ]; then
            echo "::error::Android app Gradle file not found"
            find extracted -maxdepth 5 -type f | head -n 100
            exit 1
          fi

          ANDROID_DIR="${GRADLE_FILE%/app/*}"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $ANDROID_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Feloos-debug-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
